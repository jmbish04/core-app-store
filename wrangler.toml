name = "core-app-store"
main = "src/index.ts"
compatibility_date = "2025-12-14"
node_compat = true

[observability]
enabled = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "core-app-store"
database_id = "1a5b8cf8-afaf-49e8-b7d7-095ea3eec041" // [2025-12-15] Set by jmbish04 (repo owner)

# KV Namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "1366c4a4bddb4a7c96c0e9201270d16d" // [2025-12-15] Set by jmbish04 (repo owner)

# Worker AI binding
[ai]
binding = "AI"
remote = true

# Workflows binding
[[workflows]]
binding = "WORKFLOWS"
name = "core-app-store-workflows"

# Analytics Engine (optional, for tracking)
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Cron triggers
[triggers]
crons = [
  "*/15 * * * *",  # Every 15 minutes - lightweight health refresh
  "0 * * * *",     # Every hour - log insights & repo inference
  "0 2 * * *"      # Daily at 2 AM - full inventory reconcile
]

# Build configuration
[build]
command = "npm run build"
